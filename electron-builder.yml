appId: com.moonglass.studio
productName: MoonGlass
copyright: Copyright © 2026 MoonGlass Contributors
directories:
  output: dist
  buildResources: build-resources
# pi 运行时（含 node_modules 依赖）由 afterPack 钩子注入，见 build-resources/afterPack.cjs
afterPack: build-resources/afterPack.cjs
files:
  - out/**/*
  - resources/**/*
  - package.json
  - LICENSE
  - NOTICE
  - LICENSE-CHANGE.md
  - COMMERCIAL-LICENSE.md
  - THIRD-PARTY-NOTICES.md
  - PRIVACY.md
  - TRADEMARKS.md
  - SECURITY.md
  - docs/USER-MANUAL-ZH-CN.md
extraResources:
  - from: resources/moonglass/pi-bridge
    to: pi-bridge
  - from: packages/eda-bridge/src
    to: pi-bridge/eda-bridge/src
  - from: packages/verification-intelligence-engine/src
    to: verification-intelligence/src
  - from: resources/moonglass/ip-library
    to: ip-library
  - from: resources/moonglass/rules
    to: rules
  - from: resources/moonglass/skills
    to: skills
  - from: resources/moonglass/bundled-toolchains
    to: bundled-toolchains
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  icon: resources/moonglass/logo.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/moonglass/logo.png
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/moonglass/logo.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
